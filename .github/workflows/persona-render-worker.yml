name: Build persona render worker

on:
  push:
    branches: [persona-render-cloud-v1]
    paths:
      - persona-render-worker/**
      - .github/workflows/persona-render-worker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/goonidz/persona-render-worker
          tags: |
            type=sha
            type=raw,value=cloud-v1
      - uses: docker/build-push-action@v6
        with:
          context: ./persona-render-worker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
