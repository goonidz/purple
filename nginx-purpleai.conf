# Configuration nginx pour VideoFlow avec DuckDNS (purpleai.duckdns.org)
# À copier dans /etc/nginx/sites-available/purpleai sur le VPS

server {
    listen 80;
    listen [::]:80;
    server_name purpleai.duckdns.org;

    # Logs
    access_log /var/log/nginx/purpleai-access.log;
    error_log /var/log/nginx/purpleai-error.log;

    # Fix pour les gros cookies/headers
    large_client_header_buffers 4 32k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Frontend - Proxy vers le container Docker (port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Video Render Service API
    location /api/render/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts longs pour le rendu vidéo
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Pas de limite de taille pour upload
        client_max_body_size 100M;
    }

    # Video Storage API - Upload endpoint (from RunPod)
    location /api/upload-video {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # No size limit for video uploads
        client_max_body_size 0;
        proxy_request_buffering off;
        
        # Long timeouts for large uploads
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Video Storage API - Download endpoint with custom filename
    location /api/download-video/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Long timeout for large downloads
        proxy_read_timeout 600s;
    }

    # Serve rendered videos directly (static files)
    location /rendered-videos/ {
        alias /var/www/rendered-videos/;
        
        # Enable CORS
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Range, Content-Type';
        
        # Enable range requests for video seeking
        add_header Accept-Ranges bytes;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}
