# Configuration nginx pour VideoFlow avec DuckDNS (purpleai.duckdns.org)
# À copier dans /etc/nginx/sites-available/purpleai sur le VPS

# Configuration HTTP (sera redirigée vers HTTPS après installation du certificat)
server {
    listen 80;
    listen [::]:80;
    server_name purpleai.duckdns.org;

    # Logs
    access_log /var/log/nginx/purpleai-access.log;
    error_log /var/log/nginx/purpleai-error.log;

    # Frontend - Proxy vers le container Docker
    location / {
        proxy_pass http://localhost:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Video Render Service API
    location /api/render/ {
        proxy_pass http://localhost:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts longs pour le rendu vidéo
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Pas de limite de taille pour upload
        client_max_body_size 100M;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:80/health;
        access_log off;
    }
}

