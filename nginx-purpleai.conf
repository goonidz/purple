# Configuration nginx pour VideoFlow/PurpleAI (purpleai.duckdns.org)
#
# SOURCE DE VÉRITÉ : ce fichier est copié vers
# /etc/nginx/sites-available/purpleai par fix-nginx-docker.sh lors
# du déploiement. NE PAS éditer la config nginx à la main sur le VPS
# — éditez ce fichier ici puis `./deploy.sh` sur le VPS.
#
# Toute nouvelle route (SPA, API, service PM2) DOIT être ajoutée ici.
# fix-nginx-docker.sh refuse de déployer si une route critique manque
# (cf. liste REQUIRED_LOCATIONS dans le script).

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name purpleai.duckdns.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name purpleai.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/purpleai.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purpleai.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logs
    access_log /var/log/nginx/purpleai-access.log;
    error_log /var/log/nginx/purpleai-error.log;

    # Fix pour les gros cookies/headers
    large_client_header_buffers 4 32k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Frontend - Proxy vers le container Docker (port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Video Render Service API
    location /api/render/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts longs pour le rendu vidéo
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Pas de limite de taille pour upload
        client_max_body_size 100M;
    }

    # Video Storage API - Upload endpoint (from RunPod)
    location /api/upload-video {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # No size limit for video uploads
        client_max_body_size 0;
        proxy_request_buffering off;

        # Long timeouts for large uploads
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Video Storage API - Download endpoint with custom filename
    location /api/download-video/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long timeout for large downloads
        proxy_read_timeout 600s;
    }

    # Serve rendered videos directly (static files)
    location /rendered-videos/ {
        alias /var/www/rendered-videos/;

        # Enable CORS
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Range, Content-Type';

        # Enable range requests for video seeking
        add_header Accept-Ranges bytes;
    }

    # Serve gameplay videos directly (static files, per-user folders)
    location /gameplay/ {
        alias /var/www/gameplay/;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Range, Content-Type';
        add_header Accept-Ranges bytes;
    }

    # Gameplay API endpoints (proxied to video-storage-api)
    location /api/upload-gameplay {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 0;
        proxy_request_buffering off;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/list-gameplay {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/delete-gameplay/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve blackscreen videos directly (static files, per-user folders)
    location /blackscreen/ {
        alias /var/www/blackscreen/;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Range, Content-Type';
        add_header Accept-Ranges bytes;
    }

    # Blackscreen API endpoints (proxied to video-storage-api)
    location /api/upload-blackscreen {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 0;
        proxy_request_buffering off;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/list-blackscreen {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/delete-blackscreen/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Remotion Service API (animator per-scene generation, render)
    location /remotion-api/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        client_max_body_size 50M;
    }

    # Remotion renders (static video files)
    location /remotion-renders/ {
        proxy_pass http://127.0.0.1:3002/renders/;
        proxy_set_header Host $host;

        add_header Access-Control-Allow-Origin *;
        add_header Accept-Ranges bytes;
    }

    # Remotion preview bundles (Animator live preview)
    location /remotion-preview/ {
        proxy_pass http://127.0.0.1:3002/preview-bundles/;
        proxy_set_header Host $host;

        add_header Access-Control-Allow-Origin *;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    # Extension API (YouTube AI Comments) — fetches VideoFlow transcripts
    # without requiring a user login. Authenticated by X-Extension-Token
    # header (shared secret) checked server-side against EXTENSION_API_TOKEN
    # env var of video-render-service. See docs/EXTENSION_TRANSCRIPT_API.md
    location /api/extension/ {
        proxy_pass http://127.0.0.1:3000/extension/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /extension/generate proxies Gemini (server-side key) and can take
        # up to ~45s on long prompts. Keep a bit of headroom over the
        # AbortSignal.timeout in video-render-service/server.js.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # CRM webmail (FastAPI service, PM2 "crm-webmail" on port 8002)
    # Route "/crm/" → FastAPI with root_path=/crm so URL generation stays correct.
    location /crm/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /crm;

        # Upload size for attachments (keep aligned with FastAPI limits).
        client_max_body_size 30m;

        # IMAP/SMTP over slow networks can take a while.
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Redirect bare /crm to /crm/ so links without trailing slash work.
    location = /crm {
        return 308 /crm/;
    }
}
